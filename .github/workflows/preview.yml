
# @author 雾晚
name: Preview Build
on:
  push:
    branches:
      - beta1-1.15
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布预览版；取消勾选仅构建验证并保留下载产物'
        type: boolean
        default: false
      approved_sha:
        description: '仅发布 main 上经审查的精确 40 位提交 SHA'
        type: string
        required: false

concurrency:
  group: wanbox-release-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh nb4a.properties | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
            app/executableSo
          # @author 雾晚: share the verified cache for exactly the same core inputs.
          key: native-audit-${{ hashFiles('libcore/**', 'buildScript/lib/**', 'buildScript/init/**', 'nb4a.properties') }}
      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Prepare pinned source for cached-core tests
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          bash buildScript/lib/core/get_source.sh
          (cd libcore && go mod tidy)
      - name: Verify LibCore AAR
        run: |
          test -s app/libs/libcore.aar
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "app/executableSo/$abi/librootbox.so"
          done
      - name: Upload LibCore AAR
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          if-no-files-found: error
      - name: Upload Root TUN executables
        uses: actions/upload-artifact@v4
        with:
          name: root-tun-executables
          path: app/executableSo
          if-no-files-found: error
      - name: Ensure NDK clang present
        run: |
                    NDK_DIR="$ANDROID_HOME/ndk/25.0.8775105"
                    CLANG="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
                    if [ ! -f "$CLANG" ]; then
                        echo "NDK clang missing, installing ndk;25.0.8775105 via sdkmanager"
                        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.0.8775105"
                    fi
                    test -f "$CLANG"
      - name: Verify and package Root module
        run: |
          set -o pipefail
          go -C rootmodule test -race -json ./... | tee root-module-tests.jsonl
          go -C rootmodule vet ./...
          python3 -m unittest discover -s rootmodule -p 'test_*.py'
          python3 -m unittest discover -s tools/diagnostics -p test_sample_root_runtime.py
          python3 -m unittest discover -s tools -p test_verify_apk_abi.py
          (cd libcore && go test -tags=with_clash_api,with_gvisor,with_quic,with_wireguard,with_utls .)
          (cd libcore && go test ./internal/... ./protocol/urltest ./protocol/loadbalance)
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.0.8775105" bash rootmodule/build.sh
      - name: Upload Root module
        uses: actions/upload-artifact@v4
        with:
          name: root-module
          path: rootmodule/build/wanbox-root-module-arm64-v8a.zip
          if-no-files-found: error
      - name: Preserve module test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-module-test-results
          path: root-module-tests.jsonl
  build:
    name: Build OSS APK
    runs-on: ubuntu-24.04
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download LibCore AAR
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Download Root TUN executables
        uses: actions/download-artifact@v4
        with:
          name: root-tun-executables
          path: app/executableSo
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Prepare release signing key
        env:
          WANBOX_KEYSTORE_BASE64: ${{ secrets.WANBOX_KEYSTORE_BASE64 }}
          WANBOX_KEYSTORE_PASSWORD: ${{ secrets.WANBOX_KEYSTORE_PASSWORD }}
        run: |
          test -n "$WANBOX_KEYSTORE_BASE64"
          test -n "$WANBOX_KEYSTORE_PASSWORD"
          printf '%s' "$WANBOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wanbox-release.p12"
          test -s "$RUNNER_TEMP/wanbox-release.p12"
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANBOX_KEYSTORE_FILE: ${{ runner.temp }}/wanbox-release.p12
          WANBOX_KEYSTORE_PASSWORD: ${{ secrets.WANBOX_KEYSTORE_PASSWORD }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew :core-domain:test app:testPreviewDebugUnitTest app:compilePreviewDebugAndroidTestKotlin
          python3 -m unittest discover -s tools -p 'test_*.py'
          ./gradlew app:assemblePreviewRelease -PwanboxThin=true
          python3 tools/check_android_security.py previewRelease
          APK_DIR=app/build/outputs/apk/preview/release
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -d "$APK_DIR"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "${ANDROID_HOME}/build-tools" -name aapt | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -n "$AAPT"
          PREVIEW_VERSION=$(grep '^PRE_VERSION_NAME=' nb4a.properties | cut -d= -f2 | tr -d '\r')
          FORMAL_APK_CODE=$(python3 tools/version_code.py --properties nb4a.properties --channel formal --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["apk_version_code"])')
          PREVIEW_APK_CODE=$(python3 tools/version_code.py --properties nb4a.properties --channel preview --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["apk_version_code"])')
          python3 tools/version_code.py --channel formal --enforce --baseline-apk-code 10065 --baseline-module-code 2013
          python3 tools/version_code.py --channel preview --enforce --baseline-apk-code 10077 --baseline-module-code 2015
          test "$PREVIEW_APK_CODE" -gt "$FORMAL_APK_CODE"
          test "$(find "$APK_DIR" -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(grep -c 'android:targetPackage="com.lit008834.pixel.wanboxforandroid"' app/src/main/res/xml/shortcuts.xml)" -eq 4
          for apk in "$APK_DIR"/*.apk; do
            case "$(basename "$apk")" in wanBoxForAndroid-"$PREVIEW_VERSION"-*.apk) ;; *) exit 1 ;; esac
            python3 tools/verify_apk_abi.py --thin "$apk"
            "$AAPT" dump badging "$apk" | grep -q "^package: name='com.lit008834.pixel.wanboxforandroid' versionCode='$PREVIEW_APK_CODE' versionName='$PREVIEW_VERSION' "
            manifest=$($AAPT dump xmltree "$apk" AndroidManifest.xml)
            printf '%s\n' "$manifest" | grep -q 'com.lit008834.pixel.wanboxforandroid.cache'
            printf '%s\n' "$manifest" | grep -q 'io.nekohasekai.sagernet.widget.WidgetControlReceiver'
            signer_digest=$("$APKSIGNER" verify --verbose --print-certs "$apk" | grep -m1 -i 'certificate SHA-256 digest' | sed 's/.*: *//' | tr -d ' \r' | tr '[:lower:]' '[:upper:]')
            echo "$(basename "$apk") certificate SHA-256: $signer_digest"
            test "$signer_digest" = '80ECEE1C42D861D59CDC460447335FC4BFDF80103D6225A17C1BDF83A33521F6'
          done
          mkdir -p public-apks
          cp "$APK_DIR"/*arm64-v8a*.apk public-apks/
          echo "APK=public-apks" >> "$GITHUB_ENV"
          ./gradlew app:assembleOssRelease -PwanboxThin=true
          FORMAL_APK=$(find app/build/outputs/apk/oss/release -name '*arm64-v8a*.apk')
          test -n "$FORMAL_APK"
          "$AAPT" dump badging "$FORMAL_APK" | tee formal-apk-badging.txt
          grep -q "versionCode='$FORMAL_APK_CODE' versionName='3.0.14'" formal-apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$FORMAL_APK" > formal-apk-signature.txt
          grep -qi '80ecee1c42d861d59cdc460447335fc4bfdf80103d6225a17c1bdf83a33521f6' formal-apk-signature.txt
          python3 tools/verify_apk_abi.py --thin "$FORMAL_APK"
          # @author 雾晚: same source and signature, emulator-only ABI; never uploaded to Release.
          WANBOX_INTERNAL_TEST=1 ./gradlew app:assemblePreviewRelease -PwanboxInternalTestAbi=x86_64
          mkdir -p internal-apks
          cp "$APK_DIR"/*x86_64*.apk internal-apks/
          for fixture in internal-apks/*.apk; do "$APKSIGNER" verify "$fixture"; done
          # @author 雾晚: disposable emulator fixture for real Room/portable backup roundtrip.
          WANBOX_INTERNAL_TEST=1 ./gradlew app:assemblePreviewDebug app:assemblePreviewDebugAndroidTest -PwanboxInternalTestAbi=x86_64
          mkdir -p internal-policy
          cp app/build/outputs/apk/preview/debug/*x86_64*.apk internal-policy/manager.apk
          cp app/build/outputs/apk/androidTest/preview/debug/*.apk internal-policy/tests.apk
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ${{ env.APK }}
      - name: Download module without manager
        uses: actions/download-artifact@v4
        with:
          name: root-module
          path: module-artifacts
      - name: Bundle verified signed management APK
        run: |
          python3 rootmodule/bundle_manager.py --source module-artifacts/wanbox-root-module-arm64-v8a.zip --apk public-apks/*arm64-v8a*.apk --output module-artifacts/wanbox-root-module-with-manager-arm64-v8a.zip
          python3 -m zipfile -t module-artifacts/wanbox-root-module-with-manager-arm64-v8a.zip
      - uses: actions/upload-artifact@v4
        with:
          name: root-module-with-manager
          path: module-artifacts/wanbox-root-module-with-manager-arm64-v8a.zip
          if-no-files-found: error
      - name: Validate unpublished candidate assets
        run: |
          mkdir candidate
          cp public-apks/*.apk module-artifacts/*.zip candidate/
          AAPT=$(find "${ANDROID_HOME}/build-tools" -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          python3 tools/verify_preview_candidate.py --directory candidate --report candidate-validation.json --aapt "$AAPT" --apksigner "$APKSIGNER"
          PREVIEW_TAG="v$(grep '^PRE_VERSION_NAME=' nb4a.properties | cut -d= -f2 | tr -d '\r')" python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("candidate-validation.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          report["source_sha"] = os.environ["GITHUB_SHA"]
          report["run_id"] = int(os.environ["GITHUB_RUN_ID"])
          report["candidate_tag"] = os.environ["PREVIEW_TAG"]
          path.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          Path("candidate/candidate-validation.json").write_text(path.read_text(encoding="utf-8"), encoding="utf-8")
          PY
          (cd candidate && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: preview-candidate
          path: candidate/*
          if-no-files-found: error
      - name: Preserve candidate validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-validation-reports
          path: |
            candidate-validation.json
            formal-apk-badging.txt
            formal-apk-signature.txt
            app/build/test-results
            app/build/reports/tests
      - uses: actions/upload-artifact@v4
        with:
          name: internal-upgrade-fixture
          path: internal-apks/*.apk
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: internal-data-policy-fixture
          path: internal-policy/*.apk
          if-no-files-found: error
          retention-days: 1

  benchmark:
    name: Candidate cold-start measurement (emulator only)
    needs: libcore
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Prepare benchmark build
        env:
          BUILD_PLUGIN: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./run init action gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure existing no-profile cold-start benchmark
        uses: reactivecircus/android-emulator-runner@v2
        env:
          WANBOX_INTERNAL_TEST: '1'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: |
            ./gradlew app:connectedPreviewDebugAndroidTest -PwanboxThin=true -PwanboxInternalTestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=io.nekohasekai.sagernet.PortableBackupCompatibilityTest
            ./gradlew :benchmark:connectedOssBenchmarkAndroidTest -PwanboxBenchmark=true -PwanboxThin=true -PwanboxInternalTestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.lit008834.wanbox.benchmark.StartupBenchmark#coldStartNoProfile -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-cold-start-baseline
          path: |
            benchmark/build/outputs
            benchmark/build/reports
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
          if-no-files-found: warn

  publish:
    name: Publish Preview Release
    # @author 雾晚: validation-only runs must never replace an existing Release.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-24.04
    needs:
      - build
      - benchmark
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify exact reviewed main SHA
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$APPROVED_SHA"
      - name: Get Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^PRE_VERSION_NAME=' nb4a.properties | cut -d'=' -f2 | tr -d '\r\n')
          export RELEASE_TAG="v$VERSION"
          bash tools/check_release_tag.sh
          echo "PREVIEW_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Download the validated candidate from this exact run
        uses: actions/download-artifact@v4
        with:
          name: preview-candidate
          path: candidate
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate provenance and unchanged manifest
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          python3 tools/verify_preview_candidate_artifact.py --directory candidate --source-sha "$APPROVED_SHA" --run-id "$GITHUB_RUN_ID" --tag "$PREVIEW_TAG"
          (cd candidate && sha256sum --check SHA256SUMS)
          python3 tools/prepare_preview_release_notes.py --input PREVIEW_NOTES.md --output "$RUNNER_TEMP/preview-notes.md"
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PREVIEW_TAG }}
          target_commitish: ${{ github.sha }}
          name: wanBox ${{ env.PREVIEW_TAG }} — 稳定性预览
          body_path: ${{ runner.temp }}/preview-notes.md
          files: |
            candidate/*.apk
            candidate/*.zip
            candidate/SHA256SUMS
          draft: false
          prerelease: true
          make_latest: false
      - name: Verify published tag and release before cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PREVIEW_TAG")
          jq -e --arg tag "$PREVIEW_TAG" --arg title "wanBox $PREVIEW_TAG — 稳定性预览" '.tag_name == $tag and .name == $title and .draft == false and .prerelease == true' <<<"$release_json" >/dev/null
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$PREVIEW_TAG")
          object_type=$(jq -r '.object.type' <<<"$tag_ref")
          object_sha=$(jq -r '.object.sha' <<<"$tag_ref")
          if [ "$object_type" = tag ]; then
            tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")
            object_type=$(jq -r '.object.type' <<<"$tag_object")
            object_sha=$(jq -r '.object.sha' <<<"$tag_object")
          fi
          test "$object_type" = commit
          test "$object_sha" = "$APPROVED_SHA"
      - name: Verify published preview and retain only newest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prune_prereleases.py --repo "$GITHUB_REPOSITORY" --keep-tag "$PREVIEW_TAG"
