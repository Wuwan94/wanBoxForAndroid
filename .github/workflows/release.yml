name: 发布（Release）

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: 验证发布版本与更新日志
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 拉取发布元数据
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            docs
            src/module/module.prop

      - name: 配置发布脚本 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 检查 tag、模块版本与更新日志
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag || {
            echo '发布工作流只能从已有的 v<版本号> tag 运行。' >&2
            exit 1
          }
          node .github/scripts/release-preflight.mjs \
            src/module/module.prop docs/changelog.md "$TAG"

  build:
    name: 并行构建模块与管理器
    needs: preflight
    uses: ./.github/workflows/build-module.yml
    with:
      # 发布构建的 versionName 不能带 -ci.<sha> 测试后缀。
      manager-ci: false
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  release:
    name: 发布 Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.build.outputs.version }}
      COMMIT_COUNT: ${{ needs.build.outputs.commit_count }}
      MODULE_NAME: ${{ needs.build.outputs.module_name }}
    steps:
      - name: 拉取发布脚本与更新日志
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            docs
            .github/kernelsu

      - name: 配置发布脚本 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 下载本次运行的完整模块包
        uses: actions/download-artifact@v8
        with:
          name: module-package

      - name: 校验模块包与发布身份
        if: "!contains(github.ref_name, '-preview') && !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta')"
        env:
          TAG: ${{ github.ref_name }}
        run: node .github/scripts/prepare-kernelsu.mjs check "$TAG" "$MODULE_NAME" "$COMMIT_COUNT"

      - name: KernelSU 分发预检
        if: "!contains(github.ref_name, '-preview') && !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta')"
        uses: KernelSU-Modules/tools/actions/module-release@ca1187c92135b3c31e48d37e008d61153120a08b
        with:
          zip: ${{ env.MODULE_NAME }}
          tag: ${{ github.ref_name }}
          repository: Wuwan94/wanBox-Releases
          token: ${{ secrets.DIST_REPO_TOKEN }}
          require-immutable: true
          dry-run: true

      - name: 生成模块自更新清单
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          jq -n \
            --arg version "Module ${TAG}" \
            --argjson versionCode "${COMMIT_COUNT}" \
            --arg zipUrl "https://github.com/${REPO}/releases/download/${TAG}/${MODULE_NAME}" \
            --arg changelog "https://raw.githubusercontent.com/${REPO}/refs/heads/main/docs/changelog.md" \
            '{version: $version, versionCode: $versionCode, zipUrl: $zipUrl, changelog: $changelog}' \
            > update.json
          cat update.json

      - name: 提取当前版本更新日志
        run: |
          node .github/scripts/extract-release-notes.mjs \
            docs/changelog.md \
            "$VERSION" \
            "$RUNNER_TEMP/release-notes.md"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            ${{ env.MODULE_NAME }}
            update.json
          prerelease: ${{ contains(github.ref_name, '-preview') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新模块自更新指针
        # module.prop 的 updateJson 指向 update-index 分支上的固定地址。
        # 不能用 releases/latest/download：预览版是 prerelease，latest 只会解析到正式版，
        # 正式版又没有 update.json，最终 404。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/update-index"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --quiet --depth 1 --branch update-index "$remote" "$work" 2>/dev/null; then
            echo "复用已有的 update-index 分支"
          else
            rm -rf "$work"
            git init -q "$work"
            git -C "$work" remote add origin "$remote"
            git -C "$work" symbolic-ref HEAD refs/heads/update-index
          fi
          cp update.json "$work/update.json"
          git -C "$work" add update.json
          if git -C "$work" diff --cached --quiet; then
            echo "自更新指针内容未变化，跳过提交"
            exit 0
          fi
          git -C "$work" \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore: 自更新指针更新到 ${GITHUB_REF_NAME} [skip ci]"
          git -C "$work" push --quiet origin update-index

      - name: 清理上一次发布，只保留最新一版
        # 同一频道只保留最新一个 release 与 tag。
        # 频道由 tag 后缀决定：-preview / -rc / -beta 归预览，其余归正式。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$KEEP" == *-preview* || "$KEEP" == *-rc* || "$KEEP" == *-beta* ]]; then
            CHANNEL=preview
          else
            CHANNEL=stable
          fi
          gh api --paginate -X GET "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | [.id, .tag_name] | @tsv' |
          while IFS=$'\t' read -r id tag; do
            if [[ -z "$id" || "$tag" == "$KEEP" ]]; then
              continue
            fi
            is_prerelease=false
            if [[ "$tag" == *-preview* || "$tag" == *-rc* || "$tag" == *-beta* ]]; then
              is_prerelease=true
            fi
            if [[ "$CHANNEL" == preview && "$is_prerelease" == false ]]; then
              continue
            fi
            if [[ "$CHANNEL" == stable && "$is_prerelease" == true ]]; then
              continue
            fi
            if [[ "$tag" == nightly ]]; then
              continue
            fi
            echo "清理旧 $CHANNEL 发布: $tag (id=$id)"
            gh api -X DELETE "repos/$GH_REPO/releases/$id" || true
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag" || true
          done

      - name: 发布通知到 Telegram
        continue-on-error: true
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TG_BOT_TOKEN }}
          to: ${{ secrets.TG_CHAT_ID }}
          thread-id: 2343
          parse-mode: markdown
          message: |
            **新版本发布通知**

            版本: `${{ github.ref_name }}`

            [查看更新日志并下载](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }})

            **直接下载:**
            [模块包](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.MODULE_NAME }})

  kernelsu:
    name: 分发至 KernelSU Modules
    needs: release
    uses: ./.github/workflows/publish-kernelsu.yml
    # 预览/RC/beta 不进 KernelSU Modules 正式分发（prepare-kernelsu.mjs check 仅接受 vX.Y.Z）
    if: "!contains(github.ref_name, '-preview') && !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta')"
    with:
      tag: ${{ github.ref_name }}
    secrets:
      DIST_REPO_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}

  distribution-failure:
    name: 通知独立分发失败
    needs: [release, kernelsu]
    if: always() && needs.release.result == 'success' && needs.kernelsu.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 分发失败通知
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TG_BOT_TOKEN }}
          to: ${{ secrets.TG_CHAT_ID }}
          thread-id: 2275
          message: |
            主仓库 ${{ github.ref_name }} 已发布，KernelSU 分发失败。
            请单独重试 KernelSU 正式版分发工作流，无需重新构建或发布主仓库。
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  failure:
    name: 通知构建或发布失败
    needs: [preflight, build, release]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 失败通知
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TG_BOT_TOKEN }}
          to: ${{ secrets.TG_CHAT_ID }}
          thread-id: 2275
          parse-mode: markdown
          message: |
            **发布工作流执行失败！**

            标签: `${{ github.ref_name }}`

            [点击查看构建日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
