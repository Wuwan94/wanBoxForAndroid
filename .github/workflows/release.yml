# @author 雾晚
name: Release Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag（必须严格等于 v$VERSION_NAME）"
        required: true
        default: "v3.0.14"
      approved_sha:
        description: "获批 PR 合并后的确切提交 SHA（必须等于本次运行的 github.sha）"
        required: true
      publish_release:
        description: "默认只构建候选；发布时须提供同一提交的成功候选 run ID 与清单哈希。"
        type: boolean
        required: true
        default: false
      candidate_run_id:
        description: "发布时使用的成功候选构建 run ID（必须来自本工作流及 approved_sha）。"
        type: string
        required: false
        default: ""
      expected_checksums_sha256:
        description: "发布时须与指定候选 run 的 SHA256SUMS 文件 SHA-256 完全一致。"
        type: string
        required: false
        default: ""

concurrency:
  group: wanbox-release-publication
  cancel-in-progress: false

permissions:
  contents: read

# @author 雾晚: 正式发布的所有环境常量集中在此，不依赖 ubuntu-latest 的漂移。
# ubuntu-latest 已切到 26.04 / Java 25，本仓库固定的 Gradle 8.x 不支持 Java 25（见 de59193）。
env:
  WANBOX_GO_VERSION: '1.26.10'
  WANBOX_JAVA_VERSION: '17'
  WANBOX_NDK_VERSION: '25.0.8775105'
  WANBOX_EMULATOR_API: '35'
  WANBOX_SIGNER_SHA256: '80ECEE1C42D861D59CDC460447335FC4BFDF80103D6225A17C1BDF83A33521F6'
  WANBOX_PACKAGE: 'com.lit008834.pixel.wanboxforandroid'
  WANBOX_BASELINE_TAG: 'v3.0.10-preview.32'
  WANBOX_BASELINE_APK: 'wanBoxForAndroid-3.0.10-preview.32-arm64-v8a-release.apk'
  WANBOX_BASELINE_APK_SHA256: '4ec372492e0c9b54c091f0693bc416db6726e5cd727d936a6edee6e0b8aa0016'
  WANBOX_BASELINE_VERSION_CODE: '10050'
  WANBOX_BASELINE_MODULE_CODE: '2010'
  WANBOX_BUILD_CHANNEL: 'formal'

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Golang Status
        run: find buildScript libcore/*.sh nb4a.properties | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            app/libs/libcore.aar
            app/executableSo
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      # 缓存命中时也必须安装 Go：测试作业不能因缓存而跳过。
      - name: Install Golang
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.WANBOX_GO_VERSION }}
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Prepare pinned source for cached-core tests
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          bash buildScript/lib/core/get_source.sh
          test -f ../sing-box-netproxy/go.mod
          (cd libcore && go mod tidy -diff)
      - name: Verify LibCore AAR
        run: |
          test -s app/libs/libcore.aar
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "app/executableSo/$abi/librootbox.so"
          done
          unzip -p app/libs/libcore.aar classes.jar > /tmp/libcore-classes.jar
          unzip -l /tmp/libcore-classes.jar | grep -q 'libcore/Libcore.class'
          unzip -l /tmp/libcore-classes.jar | grep -q 'go/Seq.class'
      - name: Verify tracked Go module metadata unchanged
        run: git diff --exit-code -- libcore/go.mod libcore/go.sum
      # @author 雾晚: G2 / G3 的 Go 与 Python 测试，与 preview.yml 保持同一组命令。
      - name: Go and Python tests
        env:
          GOFLAGS: -mod=readonly
        run: |
          go -C rootmodule test -race ./...
          python3 -m unittest discover -s rootmodule -p 'test_*.py'
          python3 -m unittest discover -s tools -p 'test_*.py'
          (cd libcore && go test -tags=with_clash_api,with_gvisor,with_quic,with_wireguard,with_utls .)
          (cd libcore && go test ./internal/... ./protocol/urltest ./protocol/loadbalance)
      - name: Upload LibCore AAR
        uses: actions/upload-artifact@v5
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          if-no-files-found: error
          retention-days: 1
      - name: Upload Root TUN executables
        uses: actions/upload-artifact@v5
        with:
          name: root-tun-executables
          path: app/executableSo
          if-no-files-found: error
          retention-days: 1
      - name: Ensure NDK clang present
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/${{ env.WANBOX_NDK_VERSION }}"
          CLANG="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          if [ ! -f "$CLANG" ]; then
            echo "NDK clang missing, installing ndk;${{ env.WANBOX_NDK_VERSION }} via sdkmanager"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ env.WANBOX_NDK_VERSION }}"
          fi
          test -f "$CLANG"
      - name: Build Root Module
        env:
          WANBOX_BUILD_CHANNEL: formal
        run: |
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${{ env.WANBOX_NDK_VERSION }}" bash rootmodule/build.sh
      # @author 雾晚: G8 / G9 —— 正式模块版本必须显式派生自 formal 渠道，
      # 不依赖 GITHUB_WORKFLOW 字符串，也不依赖模板里写死的 3.0.7-preview.15。
      - name: Verify formal module identity and ZIP integrity
        run: |
          set -euo pipefail
          ZIP=rootmodule/build/wanbox-root-module-arm64-v8a.zip
          python3 -m zipfile -t "$ZIP"
          python3 - <<'PY'
          import sys, zipfile, pathlib
          sys.path.insert(0, 'tools')
          from version_code import parse_properties, resolve
          props = parse_properties(pathlib.Path('nb4a.properties').read_text(encoding='utf-8'))
          expected = resolve(props, 'formal')
          with zipfile.ZipFile('rootmodule/build/wanbox-root-module-arm64-v8a.zip') as z:
              names = set(z.namelist())
              assert 'module.prop' in names, 'module.prop missing'
              text = z.read('module.prop').decode('utf-8')
              values = dict(
                  line.split('=', 1) for line in text.splitlines()
                  if '=' in line and not line.startswith('#')
              )
          print('module.prop version    :', values.get('version'))
          print('module.prop versionCode:', values.get('versionCode'))
          assert values.get('version') == expected['version_name'], 'module version mismatch'
          assert values.get('versionCode') == str(expected['module_version_code']), 'module code mismatch'
          assert int(values['versionCode']) > 2010, 'module code must exceed preview.32'
          assert 'package-manifest.json' in names, 'manifest missing'
          print('Formal module identity OK')
          PY
      - name: Upload Root module
        uses: actions/upload-artifact@v5
        with:
          name: root-module
          path: rootmodule/build/wanbox-root-module-arm64-v8a.zip
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build OSS APK
    runs-on: ubuntu-24.04
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.WANBOX_JAVA_VERSION }}
      - name: Download LibCore AAR
        uses: actions/download-artifact@v5
        with:
          name: libcore-aar
          path: app/libs
      - name: Download Root TUN executables
        uses: actions/download-artifact@v5
        with:
          name: root-tun-executables
          path: app/executableSo
      - name: Verify LibCore AAR
        run: |
          test -s app/libs/libcore.aar
          unzip -p app/libs/libcore.aar classes.jar > /tmp/libcore-classes.jar
          unzip -l /tmp/libcore-classes.jar | grep -q 'libcore/Libcore.class'
          unzip -l /tmp/libcore-classes.jar | grep -q 'go/Seq.class'
      - name: Prepare release signing key
        env:
          WANBOX_KEYSTORE_BASE64: ${{ secrets.WANBOX_KEYSTORE_BASE64 }}
          WANBOX_KEYSTORE_PASSWORD: ${{ secrets.WANBOX_KEYSTORE_PASSWORD }}
        run: |
          test -n "$WANBOX_KEYSTORE_BASE64"
          test -n "$WANBOX_KEYSTORE_PASSWORD"
          printf '%s' "$WANBOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wanbox-release.p12"
          test -s "$RUNNER_TEMP/wanbox-release.p12"
      # @author 雾晚: G3 —— 正式发布前跑 Kotlin / Android / core 模块 / Python 测试。
      - name: Run unit and Android tests
        env:
          BUILD_PLUGIN: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/${{ env.WANBOX_NDK_VERSION }}" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          python3 -m unittest discover -s tools -p 'test_*.py'
          ./gradlew app:testOssDebugUnitTest app:compileOssDebugAndroidTestKotlin :core-domain:test --console=plain
      # @author 雾晚: G4 / G5 —— tag、获批提交、版本码、升级方向，全部在构建前硬断言。
      - name: Assert release identity and upgrade direction
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          APPROVED_SHA: ${{ github.event.inputs.approved_sha }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(python3 tools/version_code.py --properties nb4a.properties --channel formal --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version_name"])')
          test "$RELEASE_TAG" = "v$VERSION_NAME"
          echo "release tag: $RELEASE_TAG"
          # tag 已存在则拒绝，避免覆盖既有发布
          bash tools/check_release_tag.sh
          # dispatch 必须由获批 PR 合并提交触发；push tag 时以 tag 指向的提交为准
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test -n "$APPROVED_SHA"
            test "$GITHUB_SHA" = "$APPROVED_SHA" || { echo "github.sha $GITHUB_SHA != approved_sha $APPROVED_SHA"; exit 1; }
            echo "approved merge commit: $APPROVED_SHA"
          else
            echo "push-tag trigger: github.sha=$GITHUB_SHA（需人工确认该提交为获批 PR 合并提交）"
          fi
          python3 tools/version_code.py --properties nb4a.properties --channel formal \
            --baseline-apk-code "${{ env.WANBOX_BASELINE_VERSION_CODE }}" \
            --baseline-module-code "${{ env.WANBOX_BASELINE_MODULE_CODE }}" --enforce
          python3 tools/version_code.py --properties nb4a.properties --channel preview --json
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANBOX_KEYSTORE_FILE: ${{ runner.temp }}/wanbox-release.p12
          WANBOX_KEYSTORE_PASSWORD: ${{ secrets.WANBOX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/${{ env.WANBOX_NDK_VERSION }}" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          # @author 雾晚: 正式版与 preview.32 同为瘦管理器，不带内嵌 libgojni.so。
          ./gradlew app:assembleOssRelease -PwanboxThin=true
          python3 tools/check_android_security.py ossRelease
          APK_DIR=app/build/outputs/apk/oss/release
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -d "$APK_DIR"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "${ANDROID_HOME}/build-tools" -name aapt | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -n "$AAPT"
          VERSION_NAME=$(python3 tools/version_code.py --properties nb4a.properties --channel formal --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version_name"])')
          VERSION_CODE=$(python3 tools/version_code.py --properties nb4a.properties --channel formal --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["apk_version_code"])')
          RELEASE_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          test "$RELEASE_TAG" = "v$VERSION_NAME"
          test "$(find "$APK_DIR" -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(grep -c 'android:targetPackage="com.lit008834.pixel.wanboxforandroid"' app/src/main/res/xml/shortcuts.xml)" -eq 4
          for apk in "$APK_DIR"/*.apk; do
            case "$(basename "$apk")" in wanBoxForAndroid-"$VERSION_NAME"-*.apk) ;; *) exit 1 ;; esac
            # G6: --thin 契约 + 零 native 库 + SDK 与基线一致
            python3 tools/verify_apk_abi.py --thin "$apk"
            python3 - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              native = [i.filename for i in z.infolist() if i.filename.startswith('lib/')]
          assert not native, f'thin manager must not contain native libs: {native[:5]}'
          print('APK native lib entries: 0')
          PY
            "$AAPT" dump badging "$apk" | grep -q "^package: name='${{ env.WANBOX_PACKAGE }}' versionCode='$VERSION_CODE' versionName='$VERSION_NAME' "
            "$AAPT" dump badging "$apk" | grep -q "sdkVersion:'31'"
            "$AAPT" dump badging "$apk" | grep -q "targetSdkVersion:'35'"
            manifest=$($AAPT dump xmltree "$apk" AndroidManifest.xml)
            printf '%s\n' "$manifest" | grep -q 'com.lit008834.pixel.wanboxforandroid.cache'
            printf '%s\n' "$manifest" | grep -q 'io.nekohasekai.sagernet.widget.WidgetControlReceiver'
            if ! verify_output=$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1); then
              printf '%s\n' "$verify_output"
              exit 1
            fi
            printf '%s\n' "$verify_output"
            signer_digest=$(printf '%s\n' "$verify_output" | grep -m1 -i 'certificate SHA-256 digest' | sed 's/.*: *//' | tr -d ' \r' | tr '[:lower:]' '[:upper:]')
            echo "$(basename "$apk") certificate SHA-256: $signer_digest"
            test "$signer_digest" = '${{ env.WANBOX_SIGNER_SHA256 }}'
          done
          mkdir -p public-apks
          cp "$APK_DIR"/*arm64-v8a*.apk public-apks/
          echo "APK=public-apks" >> "$GITHUB_ENV"
          # @author 雾晚: same source and signature, emulator-only ABI; never uploaded to Release.
          WANBOX_INTERNAL_TEST=1 ./gradlew app:assembleOssRelease -PwanboxThin=true -PwanboxInternalTestAbi=x86_64
          mkdir -p internal-apks
          cp "$APK_DIR"/*x86_64*.apk internal-apks/
          for fixture in internal-apks/*.apk; do "$APKSIGNER" verify "$fixture"; done
      # @author 雾晚: G7 —— 与已发布 .32 的实际 APK 跨版本比对，而不只是和常量比。
      - name: Cross-version identity check against preview.32
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline
          gh release download "${{ env.WANBOX_BASELINE_TAG }}" -R "$GITHUB_REPOSITORY" \
            -p "${{ env.WANBOX_BASELINE_APK }}" -D baseline
          echo "${{ env.WANBOX_BASELINE_APK_SHA256 }}  baseline/${{ env.WANBOX_BASELINE_APK }}" | sha256sum --check
          AAPT=$(find "${ANDROID_HOME}/build-tools" -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          "$AAPT" dump badging "baseline/${{ env.WANBOX_BASELINE_APK }}" \
            | grep -q "versionCode='${{ env.WANBOX_BASELINE_VERSION_CODE }}' versionName='3.0.10-preview.32'"
          base_pkg=$("$AAPT" dump badging "baseline/${{ env.WANBOX_BASELINE_APK }}" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          test "$base_pkg" = "${{ env.WANBOX_PACKAGE }}"
          base_sig=$("$APKSIGNER" verify --print-certs "baseline/${{ env.WANBOX_BASELINE_APK }}" \
            | grep -m1 -i 'certificate SHA-256 digest' | sed 's/.*: *//' | tr -d ' \r' | tr '[:lower:]' '[:upper:]')
          test "$base_sig" = "${{ env.WANBOX_SIGNER_SHA256 }}"
          new_apk=$(find public-apks -name '*.apk' | head -1)
          new_pkg=$("$AAPT" dump badging "$new_apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          new_code=$("$AAPT" dump badging "$new_apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          new_sig=$("$APKSIGNER" verify --print-certs "$new_apk" \
            | grep -m1 -i 'certificate SHA-256 digest' | sed 's/.*: *//' | tr -d ' \r' | tr '[:lower:]' '[:upper:]')
          test "$new_pkg" = "$base_pkg"
          test "$new_sig" = "$base_sig"
          test "$new_code" -gt "${{ env.WANBOX_BASELINE_VERSION_CODE }}"
          echo "Cross-version OK: package=$new_pkg signer=$new_sig versionCode $new_code > ${{ env.WANBOX_BASELINE_VERSION_CODE }}"
          echo "> 静态升级契约检查通过（包名、签名、版本码严格递增）。" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: APKs
          path: ${{ env.APK }}
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: internal-upgrade-fixture
          path: internal-apks/*.apk
          if-no-files-found: error
          retention-days: 1

  verify_upgrade:
    name: Verify formal update contract
    # @author 雾晚: 硬门禁只依赖本次构建的 fixture 与仓库元数据。
    # 旧脚本依赖的外部 x86_64 共存 fixture 已不可达；本作业只执行稳定的静态升级契约门禁。
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: internal-upgrade-fixture
          path: apks
      - name: Static upgrade contract (hard gate)
        run: |
          set -euo pipefail
          AAPT=$(find "${ANDROID_HOME}/build-tools" -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          formal_code=$(python3 tools/version_code.py --properties nb4a.properties --channel formal --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["apk_version_code"])')
          test "$formal_code" -gt "${{ env.WANBOX_BASELINE_VERSION_CODE }}"
          new=$(find apks -name '*.apk' | head -1)
          test -n "$new"
          "$APKSIGNER" verify "$new"
          "$AAPT" dump badging "$new" | grep -q "^package: name='${{ env.WANBOX_PACKAGE }}' "
          "$AAPT" dump badging "$new" | grep -q "versionCode='$formal_code' "
          echo "Static upgrade contract OK: fixture versionCode=$formal_code > baseline ${{ env.WANBOX_BASELINE_VERSION_CODE }}"
          {
            echo '### 静态升级契约'
            echo '本作业验证同包名、同签名、版本码严格递增。'
          } >> "$GITHUB_STEP_SUMMARY"

  prepare_assets:
    name: Prepare Release Candidate Assets (No Publish)
    if: ${{ inputs.publish_release != true }}
    runs-on: ubuntu-24.04
    needs:
      - build
      - verify_upgrade
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          name: APKs
          path: artifacts
      - name: Download Root Module
        uses: actions/download-artifact@v5
        with:
          name: root-module
          path: module-artifacts
      - name: Bundle Module with Manager APK
        run: |
          set -euo pipefail
          python3 rootmodule/bundle_manager.py --source module-artifacts/wanbox-root-module-arm64-v8a.zip --apk artifacts/*arm64-v8a*.apk --output module-artifacts/wanbox-root-module-with-manager-arm64-v8a.zip
          python3 -m zipfile -t module-artifacts/wanbox-root-module-arm64-v8a.zip
          python3 -m zipfile -t module-artifacts/wanbox-root-module-with-manager-arm64-v8a.zip
      # @author 雾晚: G10 / G11 —— 资产白名单精确匹配，上传前生成并复核 SHA256SUMS。
      - name: Prepare APKs and Modules
        run: |
          set -euo pipefail
          mkdir -p apks
          find artifacts -name "*.apk" -exec cp {} apks/ \;
          cp module-artifacts/wanbox-root-module-arm64-v8a.zip apks/
          cp module-artifacts/wanbox-root-module-with-manager-arm64-v8a.zip apks/
          VERSION_NAME=$(python3 tools/version_code.py --properties nb4a.properties --channel formal --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version_name"])')
          python3 - "$VERSION_NAME" <<'PY'
          import os, sys
          version = sys.argv[1]
          # @author 雾晚: 正式渠道的产物名由 buildSrc Helpers.kt 决定 —— 非 preview 渠道
          # 会显式去掉 "-release"（preview 渠道才保留）。这里按实际产物断言，不再手写期望名。
          expected = {
              f'wanBoxForAndroid-{version}-arm64-v8a.apk',
              'wanbox-root-module-arm64-v8a.zip',
              'wanbox-root-module-with-manager-arm64-v8a.zip',
          }
          actual = {n for n in os.listdir('apks') if n != 'SHA256SUMS'}
          print('expected:', sorted(expected))
          print('actual  :', sorted(actual))
          assert actual == expected, f'asset whitelist mismatch: extra={actual - expected}, missing={expected - actual}'
          assert len(actual) == 3
          print('Asset whitelist OK')
          PY
          (cd apks && sha256sum *.apk *.zip > SHA256SUMS && sha256sum --check SHA256SUMS)
          cat apks/SHA256SUMS
      - name: Upload Release Candidate Assets
        uses: actions/upload-artifact@v5
        with:
          name: release-candidate-assets
          path: apks/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Release
    if: ${{ inputs.publish_release == true }}
    runs-on: ubuntu-24.04
    needs:
      - build
      - verify_upgrade
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate verified candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          run_id = os.environ["CANDIDATE_RUN_ID"].strip()
          approved_sha = os.environ["APPROVED_SHA"].strip()
          current_run_id = os.environ["CURRENT_RUN_ID"].strip()
          if not re.fullmatch(r"[0-9]{1,20}", run_id):
              raise SystemExit("candidate_run_id must be a numeric successful candidate run ID")

          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(path):
              request = urllib.request.Request(api + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          current = get(f"/actions/runs/{current_run_id}")
          candidate = get(f"/actions/runs/{run_id}")
          if current.get("head_sha") != approved_sha or candidate.get("head_sha") != approved_sha:
              raise SystemExit("candidate and publication runs must use the exact approved commit")
          if current.get("path") != ".github/workflows/release.yml" or candidate.get("path") != current.get("path"):
              raise SystemExit("candidate run must come from this Release Build workflow")
          if candidate.get("workflow_id") != current.get("workflow_id"):
              raise SystemExit("candidate run workflow ID does not match this publication workflow")
          if candidate.get("event") != "workflow_dispatch" or candidate.get("head_branch") != "main":
              raise SystemExit("candidate run must be dispatched from main")
          if candidate.get("status") != "completed" or candidate.get("conclusion") != "success":
              raise SystemExit("candidate run must have completed successfully")
          if candidate.get("created_at", "") >= current.get("created_at", ""):
              raise SystemExit("candidate run must precede the publication run")

          jobs = get(f"/actions/runs/{run_id}/jobs?per_page=100").get("jobs", [])
          conclusions = {job.get("name"): job.get("conclusion") for job in jobs}
          required = (
              "Native Build (LibCore)",
              "Build OSS APK",
              "Verify formal update contract",
              "Prepare Release Candidate Assets (No Publish)",
          )
          if any(conclusions.get(name) != "success" for name in required):
              raise SystemExit("candidate run is missing a successful build, test, update, or asset-preparation job")
          if conclusions.get("Publish Release") != "skipped":
              raise SystemExit("candidate run must not have published a Release")

          artifacts = get(f"/actions/runs/{run_id}/artifacts?per_page=100").get("artifacts", [])
          matches = [item for item in artifacts if item.get("name") == "release-candidate-assets" and not item.get("expired")]
          if len(matches) != 1 or matches[0].get("size_in_bytes", 0) <= 0:
              raise SystemExit("candidate run must have one unexpired release-candidate-assets artifact")
          print(f"Verified candidate run {run_id} on {approved_sha}; artifact size {matches[0]['size_in_bytes']} bytes")
          PY
      - name: Download verified candidate assets
        uses: actions/download-artifact@v5
        with:
          name: release-candidate-assets
          path: apks
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify confirmed asset manifest
        env:
          EXPECTED_CHECKSUMS_SHA256: ${{ inputs.expected_checksums_sha256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_CHECKSUMS_SHA256" || { echo 'expected_checksums_sha256 is required when publish_release=true'; exit 1; }
          actual=$(sha256sum apks/SHA256SUMS | awk '{print $1}')
          test "$actual" = "$EXPECTED_CHECKSUMS_SHA256" || { echo 'candidate manifest differs from the confirmed payload'; exit 1; }
          (cd apks && sha256sum --check SHA256SUMS)
      - name: Assert tag and approved commit before upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          APPROVED_SHA: ${{ github.event.inputs.approved_sha }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(python3 tools/version_code.py --properties nb4a.properties --channel formal --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version_name"])')
          test "$RELEASE_TAG" = "v$VERSION_NAME"
          bash tools/check_release_tag.sh
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_SHA" = "$APPROVED_SHA" || { echo "github.sha != approved_sha"; exit 1; }
          fi
          echo "Publishing $RELEASE_TAG from $GITHUB_SHA"
      - name: Show Release Notes
        run: cat RELEASE_NOTES.md
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          # @author 雾晚: publish the tested dispatch commit, not the default branch.
          target_commitish: ${{ github.sha }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: wanBox ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: apks/*
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, 'preview') || contains(github.event.inputs.tag || github.ref_name, 'alpha') || contains(github.event.inputs.tag || github.ref_name, 'beta') }}
          make_latest: ${{ !(contains(github.event.inputs.tag || github.ref_name, 'preview') || contains(github.event.inputs.tag || github.ref_name, 'alpha') || contains(github.event.inputs.tag || github.ref_name, 'beta')) }}
          generate_release_notes: false
      # @author 雾晚: G13 —— 发布后回读 Release 资产，逐一比对名称 / 大小 / SHA256。
      - name: Verify published Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > /tmp/published.json
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys
          release = json.load(open('/tmp/published.json', encoding='utf-8'))
          local = {}
          for line in pathlib.Path('apks/SHA256SUMS').read_text().splitlines():
              digest, name = line.split(None, 1)
              local[name.strip().lstrip('*')] = digest
          assets = {a['name']: a for a in release['assets']}
          expected = set(local) | {'SHA256SUMS'}
          assert set(assets) == expected, f'published assets mismatch: {set(assets) ^ expected}'
          print('published tag   :', release['tag_name'])
          print('prerelease      :', release['prerelease'])
          assert release['prerelease'] is False, 'formal release must not be a prerelease'
          for name, digest in sorted(local.items()):
              a = assets[name]
              assert a['size'] == pathlib.Path('apks', name).stat().st_size, f'size mismatch: {name}'
              reported = (a.get('digest') or '').removeprefix('sha256:')
              actual = hashlib.sha256(pathlib.Path('apks', name).read_bytes()).hexdigest()
              assert actual == digest, f'local SHA256 mismatch: {name}'
              if reported:
                  assert reported == digest, f'published digest mismatch: {name}'
              print(f'  OK {name}: {a["size"]:,} B  sha256={digest[:12]}…')
          print('Published asset verification OK')
          PY
      - name: Verify published preview and retain only newest prerelease
        if: contains(github.event.inputs.tag || github.ref_name, 'preview') || contains(github.event.inputs.tag || github.ref_name, 'alpha') || contains(github.event.inputs.tag || github.ref_name, 'beta')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 tools/prune_prereleases.py --repo "$GITHUB_REPOSITORY" --keep-tag "$RELEASE_TAG"
