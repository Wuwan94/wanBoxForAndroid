name: Diagnose PR101 transient dialogs
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Reuse native fixtures from exact diagnostic source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/45602793020 --jq .head_sha)" = 73c3263f1424b47eb37c4e46d656fa526cb7c029
          gh run download 45602793020 -n libcore-aar -D app/libs
          gh run download 45602793020 -n root-tun-executables -D app/executableSo
      - name: Build same thin debug UI fixtures
        env:
          BUILD_PLUGIN: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          ./run init action gradle
          WANBOX_INTERNAL_TEST=1 ./gradlew app:assembleOssDebug app:assembleOssDebugAndroidTest -PwanboxInternalTestAbi=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce exact three failures repeatedly, no retries-on-failure
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: bash tools/diagnostics/pr101-ui-repeat.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pr101-ui-repeat-evidence
          path: pr101-ui-repeat
