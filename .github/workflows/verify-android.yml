# @author 雾晚
name: Verify Android Build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      size_lab:
        description: '同时运行体积实验室（strip/UPX 实验，只出报告不发布）'
        type: boolean
        default: false
      skip_app:
        description: '跳过 libcore 与 app 作业，只跑体积实验室'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  libcore:
    name: Build LibCore
    if: ${{ github.event.inputs.skip_app != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ^1.25
          cache-dependency-path: libcore/go.sum
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: |
            app/libs/libcore.aar
            app/executableSo
          key: native-audit-${{ hashFiles('libcore/**', 'buildScript/lib/**', 'buildScript/init/**', 'nb4a.properties') }}
      - name: Prepare core source for cached tests
        if: steps.native-cache.outputs.cache-hit == 'true'
        run: |
          bash buildScript/lib/core/init.sh
          (cd libcore && go mod tidy)
      - name: Build native core
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Ensure Android NDK
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/25.0.8775105"
          CLANG="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          if [ ! -f "$CLANG" ]; then
            echo "NDK clang missing, installing ndk;25.0.8775105 via sdkmanager"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.0.8775105"
          fi
          test -f "$CLANG"
      - name: Test bounded URL probes and configuration templates
        run: |
          (cd libcore && go test -tags=with_clash_api,with_gvisor,with_quic,with_wireguard,with_utls .)
          (cd libcore && go test ./internal/... ./protocol/urltest ./protocol/loadbalance)
          (cd libcore && go test -race ./protocol/urltest ./protocol/loadbalance)
          # @author 雾晚: real SCM_RIGHTS ownership, panic, truncation and repeated requests.
          (cd libcore && go test -race protect.go protect_test.go)
          # @author 雾晚: exercise the Android/Linux append writer under concurrent rotation.
          (cd libcore && go test -race log.go log_test.go)
          (cd libcore && go test -race tun_source.go tun_source_test.go)
          python3 -m unittest discover -s tools -p test_clean_subscription.py
          go -C ../sing-box-netproxy run ./cmd/sing-box check -c "$GITHUB_WORKSPACE/docs/config/local-proxy.json"
          go -C ../sing-box-netproxy run ./cmd/sing-box check -c "$GITHUB_WORKSPACE/docs/config/tun-fakeip.json"
      - name: Test and package independent Root module
        run: |
          go -C rootmodule test -race ./...
          go -C rootmodule vet ./...
          python3 -m unittest discover -s rootmodule -p 'test_*.py'
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.0.8775105" bash rootmodule/build.sh
      - name: Verify native artifact
        run: |
          test -s app/libs/libcore.aar
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "app/executableSo/$abi/librootbox.so"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v5
        with:
          name: root-tun-executables
          path: app/executableSo
          if-no-files-found: error
          retention-days: 1

  app:
    name: Build Android Debug APK
    if: ${{ github.event.inputs.skip_app != 'true' }}
    runs-on: ubuntu-latest
    needs: libcore
    env:
      BUILD_PLUGIN: none
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v5
        with:
          name: libcore-aar
          path: app/libs
      - uses: actions/download-artifact@v5
        with:
          name: root-tun-executables
          path: app/executableSo
      - name: Verify native artifact
        run: |
          test -s app/libs/libcore.aar
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "app/executableSo/$abi/librootbox.so"
          done
      - name: Build app
        env:
          BUILD_PLUGIN: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          ./run init action gradle
          ./gradlew app:tasks --all
          WANBOX_INTERNAL_TEST=1 ./gradlew app:assembleOssDebug -PwanboxInternalTestAbi=x86_64
      - name: Test core modules
        run: ./gradlew :core-domain:test --stacktrace
      - name: Test debug unit suite and security contracts
        run: |
          WANBOX_INTERNAL_TEST=1 ./gradlew app:testOssDebugUnitTest app:assembleOssDebugAndroidTest -PwanboxInternalTestAbi=x86_64
          ./gradlew app:testPreviewDebugUnitTest app:assemblePreviewDebug
          python3 tools/check_android_security.py
          python3 -m unittest discover -s tools -p test_ci_probe_stages.py -v
          bash tools/diagnostics/build_security_probe.sh
      - name: Prepare key for the unpublished release comparison build
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          WANBOX_KEYSTORE_BASE64: ${{ secrets.WANBOX_KEYSTORE_BASE64 }}
        run: |
          test -n "$WANBOX_KEYSTORE_BASE64"
          printf '%s' "$WANBOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wanbox-release.p12"
      - name: Build and test signed release variants
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          WANBOX_KEYSTORE_FILE: ${{ runner.temp }}/wanbox-release.p12
          WANBOX_KEYSTORE_PASSWORD: ${{ secrets.WANBOX_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew app:assembleOssRelease
          mkdir -p public-apks
          cp app/build/outputs/apk/oss/release/*arm64-v8a*.apk public-apks/
          python3 tools/verify_apk_abi.py public-apks/*.apk
          WANBOX_INTERNAL_TEST=1 ./gradlew app:assembleOssReleaseAndroidTest -PwanboxInternalTestAbi=x86_64 -PwanboxReleaseTests
      - name: Measure same variant and ABI APK payload
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit-baseline
          # @author 雾晚: v3.0.3 was removed; keep a published, pinned OSS Release/ARM64 baseline.
          gh release download v3.0.6 -R lit008834-pixel/wanBoxForAndroid -p wanBoxForAndroid-3.0.6-arm64-v8a.apk -D audit-baseline
          echo '9917ee6758d41d5b6d335636b8236e9aa99945b5550125a3d29ff4f65dc6f3eb  audit-baseline/wanBoxForAndroid-3.0.6-arm64-v8a.apk' | sha256sum --check
          python3 tools/apk_payload_report.py audit-baseline/*.apk public-apks/*arm64-v8a*.apk > audit-baseline/payload.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate database migrations and external control (debug)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: |
            WANBOX_INTERNAL_TEST=1 ./gradlew app:connectedOssDebugAndroidTest -PwanboxInternalTestAbi=x86_64
            test "$(find app/build/outputs/connected_android_test_additional_output/ossDebugAndroidTest -name '*.png' | wc -l)" -ge 72
            bash tools/diagnostics/verify_external_control.sh
      - name: Validate release database migrations
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          WANBOX_KEYSTORE_FILE: ${{ runner.temp }}/wanbox-release.p12
          WANBOX_KEYSTORE_PASSWORD: ${{ secrets.WANBOX_KEYSTORE_PASSWORD }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: |
            WANBOX_INTERNAL_TEST=1 ./gradlew app:connectedOssReleaseAndroidTest -PwanboxInternalTestAbi=x86_64 -PwanboxReleaseTests
            test "$(find app/build/outputs/connected_android_test_additional_output/ossReleaseAndroidTest -name '*.png' | wc -l)" -eq 72
            bash tools/diagnostics/verify_launcher_shortcuts.sh
      - name: Preserve complete test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: audit-test-reports
          path: |
            app/build/reports/tests
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            probe/window.xml
            probe/external-control-logcat.txt
            probe/launcher-shortcut-logcat.txt
            audit-baseline/payload.json
            app/build/outputs/mapping
            app/build/outputs/connected_android_test_additional_output
      - name: Upload release APK
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v5
        with:
          name: release-apk
          path: public-apks/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build Magisk module
        # @author 雾晚: 模块 zip 与 App APK 都不依赖模拟器校验；前序步骤失败时仍要产出，
        # 否则体积门禁会被「模拟器起不来」这类环境故障连带跳过，数字就永远拿不到。
        if: ${{ always() }}
        run: |
          cd rootmodule
          chmod +x build.sh
          ./build.sh
      - name: Upload Magisk module
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: magisk-module
          path: rootmodule/build/wanbox-root-module-arm64-v8a.zip
          if-no-files-found: error
          retention-days: 7
      # @author 雾晚: 工作词 7.1 口径——只算模块 zip 与 App APK 两个用户下载物。
      # 当前绝对值仍超 26MB，所以这里判的是「相对已记录基线不回退」，
      # 绝对预算用 --enforce-limit 在 P7 验收时判定，避免每次构建都红且无信息量。
      - name: Measure download budget
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          set -o pipefail
          mkdir -p audit-baseline
          APK=$(ls public-apks/*arm64-v8a*.apk | head -n 1)
          echo "### 用户实际下载量（工作词 7.1 口径）" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/size_budget.py \
            --module rootmodule/build/wanbox-root-module-arm64-v8a.zip \
            --apk "$APK" \
            --baseline docs/rebuild/size-baseline.json \
            --json audit-baseline/size-budget.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # @author 雾晚: 压体积必须知道分量，不能只报总量。
      - name: Break down download payload
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          set +e
          APK=$(ls public-apks/*arm64-v8a*.apk | head -n 1)
          {
            echo '### 产物构成（未压缩 / 压缩后）'
            echo '```'
            python3 tools/size_breakdown.py rootmodule/build/wanbox-root-module-arm64-v8a.zip "$APK" --top 8
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  lab:
    name: Module Size Lab
    # 只有显式勾选 size_lab 才跑，普通 PR 不付这笔构建成本
    if: ${{ github.event.inputs.size_lab == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ^1.25
          cache-dependency-path: libcore/go.sum
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: |
            app/libs/libcore.aar
            app/executableSo
          key: native-audit-${{ hashFiles('libcore/**', 'buildScript/lib/**', 'buildScript/init/**', 'nb4a.properties') }}
      - name: Prepare core source for cached tests
        if: steps.native-cache.outputs.cache-hit == 'true'
        run: |
          bash buildScript/lib/core/init.sh
          (cd libcore && go mod tidy)
      - name: Build native core
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Ensure Android NDK
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/25.0.8775105"
          CLANG="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          if [ ! -f "$CLANG" ]; then
            echo "NDK clang missing, installing ndk;25.0.8775105 via sdkmanager"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.0.8775105"
          fi
          test -f "$CLANG"
      # @author 雾晚: 去重复实验要编 app，补 JDK 17
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build root module
        run: |
          cd rootmodule
          chmod +x build.sh
          ./build.sh
      - name: Break down module composition
        run: |
          python3 tools/size_breakdown.py rootmodule/build/wanbox-root-module-arm64-v8a.zip --top 12 \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Experiment with strip and UPX
        run: |
          set +e
          mkdir -p lab/orig lab/out
          python3 - <<'PY'
          import zipfile, pathlib
          with zipfile.ZipFile('rootmodule/build/wanbox-root-module-arm64-v8a.zip') as z:
              for name in ('bin/rootbox', 'bin/wanboxctl'):
                  data = z.read(name)
                  target = pathlib.Path('lab/orig') / pathlib.Path(name).name
                  target.write_bytes(data)
                  # @author 雾晚: zipfile 不保留 exec 位，UPX 要求输入可执行，必须补回
                  target.chmod(0o755)
                  print(f'{name}: 未压缩 {len(data):,} 字节')
          PY
          ls -l lab/orig
          STRIP="$ANDROID_HOME/ndk/25.0.8775105/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          echo "=== llvm-strip --strip-all ==="
          for f in rootbox wanboxctl; do
            cp "lab/orig/$f" "lab/out/strip-$f"
            "$STRIP" --strip-all "lab/out/strip-$f" 2>&1 | tail -2
            echo "  $f: $(stat -c%s lab/orig/$f) -> $(stat -c%s lab/out/strip-$f)"
          done
          echo "=== 安装 UPX ==="
          curl -fsSL -o /tmp/upx.tar.xz https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
          tar -C /tmp -xf /tmp/upx.tar.xz
          UPX=/tmp/upx-4.2.4-amd64_linux/upx
          "$UPX" --version | head -2
          echo "=== UPX -9（不通过不代表体积不可压，只代表该工具不适用）==="
          for f in rootbox wanboxctl; do
            if "$UPX" -9 -o "lab/out/upx-$f" "lab/orig/$f"; then
              echo "  $f: $(stat -c%s lab/orig/$f) -> $(stat -c%s lab/out/upx-$f)"
              "$UPX" -d -o "lab/out/roundtrip-$f" "lab/out/upx-$f"
              if cmp -s "lab/orig/$f" "lab/out/roundtrip-$f"; then
                echo "  还原校验：$f 解压后与原文件逐字节相同"
              else
                echo "  还原校验失败：$f 解压后不一致"
              fi
            fi
          done
      - name: Repack lab variants and report
        run: |
          set +e
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, subprocess, pathlib
          base = pathlib.Path('lab/orig')
          rows = [('原始', base / 'rootbox', base / 'wanboxctl')]
          for variant in ('strip', 'upx'):
              core = pathlib.Path(f'lab/out/{variant}-rootbox')
              cli = pathlib.Path(f'lab/out/{variant}-wanboxctl')
              if core.exists() and cli.exists():
                  rows.append((variant, core, cli))
          print('| 方案 | 模块 zip 字节 | 与原始差额 |')
          print('| --- | --- | --- |')
          baseline = None
          for name, core, cli in rows:
              out = f'lab/module-{name}.zip'
              result = subprocess.run(
                  ['python3', 'rootmodule/pack.py', '--abi', 'arm64-v8a',
                   '--core', str(core), '--cli', str(cli), '--output', out],
                  capture_output=True, text=True)
              if result.returncode != 0:
                  print(f'| {name} | 打包失败：{result.stderr.strip()[:120]} | - |')
                  continue
              size = os.stat(out).st_size
              if baseline is None:
                  baseline = size
              print(f'| {name} | {size:,} | {size - baseline:+,} |')
          print()
          print('UPX 方案只验证了「压缩后可逐字节还原」，Android arm64 加载兼容性未验证。')
          PY
      # @author 雾晚: 测「去掉内嵌引擎能省多少」。上一版用 Gradle -P 编两次，得到 71 字节的
      # 荒谬差额——多半是打包任务被判 up-to-date，跳过重打包。改用确定性做法：
      # 只编一次基线 APK，再从副本里精确删掉该条目并重算 zip，差额即该条目真实占用。
      - name: Measure APK without embedded core
        run: |
          set +e
          ./gradlew app:assembleOssDebug --console=plain -q
          if [ $? -ne 0 ]; then echo "基线 debug 构建失败"; exit 1; fi
          cp app/build/outputs/apk/oss/debug/*.apk lab/apk-base.apk
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, zipfile
          base = 'lab/apk-base.apk'
          stripped = 'lab/apk-nocore.apk'
          with zipfile.ZipFile(base) as source:
              infos = source.infolist()
              print('| APK 内 lib/ 条目 | 未压缩 | 压缩后 |')
              print('| --- | --- | --- |')
              total = 0
              for item in infos:
                  if item.filename.startswith('lib/'):
                      total += item.compress_size
                      print(f'| {item.filename} | {item.file_size:,} | {item.compress_size:,} |')
              print()
              print(f'lib/ 合计占用（压缩后）: {total:,} 字节')
              # 重写一个不含 lib/ 的副本，只用于量体积，产物不可运行、不发布
              with zipfile.ZipFile(stripped, 'w', zipfile.ZIP_DEFLATED) as target:
                  for item in infos:
                      if item.filename.startswith('lib/'):
                          continue
                      target.writestr(item, source.read(item.filename))
          b, n = os.stat(base).st_size, os.stat(stripped).st_size
          print()
          print('| APK(debug) | 字节 |')
          print('| --- | --- |')
          print(f'| 基线 | {b:,} |')
          print(f'| 删除 lib/ 后 | {n:,} |')
          print()
          print(f'差额 **{b - n:,} 字节**（{(b - n) / 1048576:.2f} MiB）')
          PY
      - name: Upload lab artifacts
        uses: actions/upload-artifact@v5
        with:
          name: size-lab
          path: |
            lab/module-*.zip
            lab/apk-*.apk
          if-no-files-found: warn
          retention-days: 7
