  - id: UC-SUB-02
    name: 手动更新订阅
    status: implemented
    triggers: [下拉刷新, 菜单更新]
    inputs: {group_id: Long}
    outputs: {added: Int, removed: Int, updated: Int}
    side_effects: [节点增删改, 失败时保留旧数据并计时退避]
    current_impl: [app/.../group/GroupUpdater.kt:123]
    impl_core: "domain/SubscriptionUseCases.kt :: updateSubscription + BackoffPolicy"
    tests: "SubscriptionTest"
    verify: cli 先成功再让 FakeHttp 500，断言旧数据未丢且 backoff 生效

  - id: UC-SUB-03
    name: 定时更新
    status: implemented
    triggers: [WorkManager 到期]
    inputs: {}
    outputs: {updated_groups: [Long]}
    side_effects: [只更新 autoUpdate 且到期的组, 未连接时跳过 updateWhenConnectedOnly]
    current_impl: [app/.../bg/SubscriptionUpdater.kt:117]
    impl_core: "domain/SubscriptionUseCases.kt :: runDueSubscriptions + SubscriptionPolicy"
    tests: "SubscriptionTest"
    verify: cli 注入固定时钟，断言到期的被更新、未到期的不动

  - id: UC-SUB-04
    name: 删除订阅
    status: implemented
    triggers: [订阅菜单删除]
    inputs: {group_id: Long}
    outputs: {}
    side_effects: [组与节点一并删除]
    current_impl: [app/.../ui/GroupFragment.kt]
    impl_core: "domain/SubscriptionUseCases.kt :: removeSubscription（连带删节点）"
    tests: "SubscriptionTest"
    verify: cli `sub delete`

