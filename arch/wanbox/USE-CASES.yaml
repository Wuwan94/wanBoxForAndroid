# wanBox 用例基线（验收用）
# 每条：谁触发 / 输入 / 输出 / 副作用；current_impl 是现状代码位置；verify 是验收方式。
# 状态：implemented = 核心层已实现并有单测；frozen = 已在真机确认行为一致（待 S0 回填）。
meta:
  project: wanBoxForAndroid
  baseline_commit: 44c359d
  frozen_at: ""          # S0 完成后填（真机逐条观察，仍待办）
  implemented: 28         # 2026-10-27：核心层全部实现，91 个单测覆盖
  total: 28

cases:
  # ---------- 连接 ----------
  - id: UC-CONN-01
    name: 连接
    status: implemented
    triggers: [主界面开关, QS 磁贴, 桌面小组件, 快捷方式]
    inputs: {profile_id: "可选，缺省用当前选中节点"}
    outputs: {state: Connected, profile_name: String}
    side_effects:
      - 前台服务启动并进入 Connected
      - 通知出现且带停止/切换动作
      - 磁贴图标与小组件状态刷新
      - 选中节点写入设置
    current_impl: [app/.../ui/DashboardFragment.kt:41, app/.../SagerNet.kt]
    impl_core: "domain/AppCore.kt :: AppCore.connect（先过 PermissionGate，再落选中节点）"
    tests: "ConnectionTest"
    verify: cli `connect` + 断言 FakeConnection 进入 Connected；真机看通知与磁贴

  - id: UC-CONN-02
    name: 断开
    status: implemented
    triggers: [主界面开关, 通知动作, 磁贴, 小组件, 快捷方式]
    inputs: {}
    outputs: {state: Idle}
    side_effects: [前台服务停止, 通知移除, 本次流量落库]
    current_impl: [app/.../ui/QuickDisableShortcut.kt:47, app/.../bg/BaseService.kt]
    impl_core: "domain/AppCore.kt :: AppCore.disconnect（traffic.persist 后回 Idle）"
    tests: "ConnectionTest"
    verify: cli `disconnect` + 断言流量 snapshot 已写入

  - id: UC-CONN-03
    name: 切换节点（连接中热切换）
    status: implemented
    triggers: [节点列表点选, 通知切换动作]
    inputs: {profile_id: Long}
    outputs: {state: Connected, current_profile: ProfileSummary}
    side_effects: [路由重建, 当前连接不中断或按策略重连, 设置写入]
    current_impl: [app/.../bg/RootTunService.kt, app/.../ui/NodeSelectDialogActivity.kt]
    impl_core: "domain/AppCore.kt / ProfileUseCases.kt :: switchTo / selectProfile"
    tests: "ConnectionTest"
    verify: cli `switch` 断言 profile 变化且状态未落 Idle

  # ---------- 节点 ----------
  - id: UC-PROF-01
    name: 从 URI / 剪贴板 / 扫码导入节点
    status: implemented
    triggers: [扫码, sn:// 深链, 粘贴]
    inputs: {uri: String, group_id: "可选"}
    outputs: {created: [ProfileSummary], duplicates: Int}
    side_effects: [节点落库, 归属分组, 重复项只提示不覆盖]
    current_impl: [app/.../ui/ScannerActivity.kt, app/.../fmt/**]
    impl_core: "domain/ProfileUseCases.kt :: importProfiles + LinkCodec.parse"
    tests: "ProfileTest"
    verify: cli `import --uri=...` 三次同 URI，断言第二次 duplicates=1

  - id: UC-PROF-02
    name: 手动新建节点
    status: implemented
    triggers: [节点页新增]
    inputs: {protocol: String, fields: Map}
    outputs: {created: ProfileSummary}
    side_effects: [落库, 列表刷新]
    current_impl: [app/.../ui/profile/*SettingsActivity.kt]
    impl_core: "domain/ProfileUseCases.kt :: createProfile"
    tests: "ProfileTest"
    verify: cli `create`

  - id: UC-PROF-03
    name: 编辑节点
    status: implemented
    triggers: [节点详情保存]
    inputs: {profile_id: Long, patch: Map}
    outputs: {updated: ProfileSummary}
    side_effects: [落库, 若为当前节点则触发重连]
    current_impl: [app/.../ui/profile/*SettingsActivity.kt]
    impl_core: "domain/ProfileUseCases.kt :: updateProfile（连接中自动重连）"
    tests: "ProfileTest"
    verify: cli `update`

  - id: UC-PROF-04
    name: 删除节点
    status: implemented
    triggers: [长按删除]
    inputs: {profile_ids: [Long]}
    outputs: {deleted: Int}
    side_effects: [落库删除, 若为当前节点则先断开, 链式配置级联处理]
    current_impl: [app/.../ui/ConfigurationFragment.kt]
    impl_core: "domain/ProfileUseCases.kt :: deleteProfiles（先断开 + clearOutbound）"
    tests: "ProfileTest"
    verify: cli `delete` 断言级联后无悬挂引用

  - id: UC-PROF-05
    name: 克隆节点
    status: implemented
    triggers: [节点菜单克隆]
    inputs: {profile_id: Long}
    outputs: {created: ProfileSummary}
    side_effects: [名称加后缀, 落库]
    current_impl: [app/.../ui/ConfigurationFragment.kt]
    impl_core: "domain/ProfileUseCases.kt :: cloneProfile"
    tests: "ProfileTest"
    verify: cli `clone`

  - id: UC-PROF-06
    name: 节点拖拽排序
    status: implemented
    triggers: [长按拖动]
    inputs: {profile_id: Long, to_index: Int}
    outputs: {order: [Long]}
    side_effects: [顺序落库]
    current_impl: [app/.../ui/ConfigurationFragment.kt]
    impl_core: "domain/ProfileUseCases.kt :: reorderProfiles"
    tests: "ProfileTest"
    verify: cli `reorder` 断言顺序持久化

  # ---------- 订阅 / 分组 ----------
  - id: UC-SUB-01
    name: 添加订阅
    status: implemented
    triggers: [订阅页新增]
    inputs: {url: String, name: String, auto_update: Boolean}
